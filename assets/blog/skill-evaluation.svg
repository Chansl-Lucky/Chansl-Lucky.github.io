<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Evaluating the contribution of a skill</title><desc id="desc">Compare performance with and without procedural guidance using explicit criteria.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#79638d" stroke-width="1.5"/></marker></defs><rect width="640" height="360" rx="14" fill="#f5f2f8"/><circle cx="610" cy="20" r="135" fill="#79638d" opacity=".045"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><text x="36" y="46" font-size="13" font-weight="600" letter-spacing="2" fill="#79638d">AGENT EVALUATION</text><rect x="40" y="100" width="230" height="68" rx="8" fill="white" stroke="#79638d" stroke-opacity=".4"/><text x="155.0" y="142.0" text-anchor="middle" fill="#79638d" font-size="24" font-weight="600">Without skill</text><rect x="370" y="100" width="230" height="68" rx="8" fill="white" stroke="#79638d" stroke-opacity=".4"/><text x="485.0" y="142.0" text-anchor="middle" fill="#79638d" font-size="24" font-weight="600">With skill</text><rect x="205" y="231" width="230" height="60" rx="8" fill="white" stroke="#79638d" stroke-opacity=".4"/><text x="320.0" y="269.0" text-anchor="middle" fill="#79638d" font-size="24" font-weight="600">Compare</text><path d="M155 180V205H278V219" fill="none" stroke="#79638d" stroke-width="2" marker-end="url(#arrow)"/><path d="M485 180V205H360V219" fill="none" stroke="#79638d" stroke-width="2" marker-end="url(#arrow)"/><text x="320" y="79" text-anchor="middle" font-size="18" fill="#79638d">The same task. Explicit criteria.</text><path d="M36 316H604" stroke="#79638d" opacity=".16"/><text x="36" y="341" font-size="12" fill="#79638d">SHILIAN CHEN · RESEARCH NOTES</text></g></svg>
